name: LLMTranslate
options:
  bundleIdPrefix: com.tyrex.llmtranslate
  deploymentTarget:
    iOS: "18.4"
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: 6X8WWWZ5AU

targets:
  LLMTranslate:
    type: application
    platform: iOS
    sources:
      - path: LLMTranslate/Sources
    resources:
      - path: LLMTranslate/Resources/Assets.xcassets
      - path: LLMTranslate/Resources/en.lproj/Localizable.strings
    entitlements:
      path: LLMTranslate/Resources/LLMTranslate.entitlements
      properties:
        com.apple.developer.translation-app: true
        com.apple.security.application-groups:
          - group.com.tyrex.llmtranslate
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyrex.llmtranslate.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate
        PRODUCT_NAME: LLMTranslate
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: BYO Translate
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Раздел 10.4/13 ТЗ: запрашивается по факту первого вызова E2/E3
        # (TranslateLatestScreenshotIntent), не на онбординге.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Нужен доступ к последнему скриншоту, чтобы перевести его по команде «Перевести скриншот»."
    dependencies:
      - target: LLMTranslateTextExt
        embed: true
      - target: LLMTranslateShareExt
        embed: true
      - target: LLMTranslateControl
        embed: true
      - target: LLMTranslateKit
        embed: true
    postbuildScripts:
      # `INFOPLIST_KEY_com.apple.developer.translation-ui-provider.network-access`
      # не подхватывается генератором Info.plist (точки в имени ключа — не
      # обычный Apple-подкейс вроде UILaunchScreen_Generation), поэтому ключ
      # раздела 4.2 ТЗ добавляется постобработкой уже сгенерированного файла.
      - name: "Добавить translation-ui-provider.network-access в Info.plist"
        script: |
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.translation-ui-provider.network-access" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.translation-ui-provider.network-access bool true" "$PLIST"
      # Собственный баг этой сборки Xcode 26.6 (см. NOTES.md — тот же класс
      # проблем, что с `-destination`/`bundle.unit-test`): при сборке через
      # `xcodebuild -target ... build` (без `-scheme` — со схемой вообще не
      # резолвится ни один симулятор) этап компиляции asset catalog
      # (actool/CompileAssetCatalog) просто не запускается — Assets.car не
      # создаётся, иконка приложения никогда не попадает в бандл. Прогоняем
      # actool вручную. `actool` также падает с exit 1 на отдельной проверке
      # версии симулятор-рантайма, не имеющей отношения к самой компиляции
      # (третий отдельный баг toolchain'а) — поэтому ориентируемся на факт
      # появления partial.plist, а не на exit code.
      - name: "Скомпилировать AppIcon вручную (actool не запускается штатно)"
        script: |
          ACTOOL_OUT="$TARGET_TEMP_DIR/actool_appicon"
          rm -rf "$ACTOOL_OUT"
          mkdir -p "$ACTOOL_OUT"
          xcrun actool --output-format human-readable-text --notices --warnings \
            --platform "$PLATFORM_NAME" \
            --app-icon AppIcon --output-partial-info-plist "$ACTOOL_OUT/partial.plist" \
            --enable-on-demand-resources NO \
            --compile "$ACTOOL_OUT" \
            "$SRCROOT/LLMTranslate/Resources/Assets.xcassets" || true

          if [ -f "$ACTOOL_OUT/partial.plist" ]; then
            cp "$ACTOOL_OUT"/AppIcon*.png "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/" 2>/dev/null
            PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$PLIST" 2>/dev/null
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad" "$PLIST" 2>/dev/null
            /usr/libexec/PlistBuddy -c "Merge $ACTOOL_OUT/partial.plist" "$PLIST"
          else
            echo "warning: actool не создал partial.plist — иконка не встроена"
          fi
      # xcodegen не группирует .strings-файлы из `resources:` в localized
      # variant group (известный баг генератора — .lproj/Localizable.strings
      # остаётся «висячим» файлом и не копируется в бандл вообще, в отличие
      # от сторибордов; см. yonaskolb/XcodeGen#763/#374). Копируем вручную,
      # тем же способом, что и AppIcon чуть выше.
      - name: "Скопировать Localizable.strings (xcodegen не группирует .strings как localized resource)"
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$DEST"
          cp "$SRCROOT/LLMTranslate/Resources/en.lproj/Localizable.strings" "$DEST/"
    scheme: {}

  LLMTranslateTextExt:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: LLMTranslateTextExt/Sources
    resources:
      - path: LLMTranslateTextExt/Resources/en.lproj/Localizable.strings
    info:
      path: LLMTranslateTextExt/Info.plist
      properties:
        CFBundleDisplayName: BYO Translate Text
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.public.translation-ui-provider
    entitlements:
      path: LLMTranslateTextExt/LLMTranslateTextExt.entitlements
      properties:
        com.apple.developer.translation-app: true
        com.apple.security.application-groups:
          - group.com.tyrex.llmtranslate
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyrex.llmtranslate.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.textext
        PRODUCT_NAME: LLMTranslateTextExt
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: false
        # LLMTranslateKit не embed-ится в само расширение (embed: false
        # ниже) — единственная копия лежит в LLMTranslate.app/Frameworks,
        # embed-нутая хост-приложением. Без явного добавления
        # @executable_path/../../Frameworks сюда расширение падает при
        # запуске: "Library not loaded: @rpath/LLMTranslateKit.framework" —
        # дефолтный LD_RUNPATH_SEARCH_PATHS для extensionkit-extension
        # содержит только @executable_path/Frameworks (свою же, пустую,
        # папку), путь до Frameworks хост-приложения в шаблоне Xcode
        # добавляется отдельной строкой (см. LD_RUNPATH_SEARCH_PATHS в
        # "iOS ExtensionKit Extension Base.xctemplate"), но xcodegen не
        # применяет этот темплейт-дефолт сам по себе.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    postbuildScripts:
      # См. комментарий у одноимённого шага в таргете LLMTranslate — тот же
      # баг xcodegen (.strings не группируется как localized resource).
      - name: "Скопировать Localizable.strings (xcodegen не группирует .strings как localized resource)"
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$DEST"
          cp "$SRCROOT/LLMTranslateTextExt/Resources/en.lproj/Localizable.strings" "$DEST/"
    dependencies:
      - target: LLMTranslateKit
        embed: false
        link: true

  LLMTranslateShareExt:
    type: app-extension
    platform: iOS
    sources:
      - path: LLMTranslateShareExt/Sources
    resources:
      - path: LLMTranslateShareExt/Resources/en.lproj/Localizable.strings
    info:
      path: LLMTranslateShareExt/Info.plist
      properties:
        CFBundleDisplayName: BYO Translate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Раздел 10.3 ТЗ: только изображения, максимум одно за раз;
            # текст сюда не принимаем — для текста работает F1
            # (TranslationUIProvider).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: LLMTranslateShareExt/LLMTranslateShareExt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tyrex.llmtranslate
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyrex.llmtranslate.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.shareext
        PRODUCT_NAME: LLMTranslateShareExt
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: false
        # Тот же фикс, что и у LLMTranslateTextExt — см. комментарий там.
        # Классическое app-extension тоже embed-ится на два уровня вложенности
        # (LLMTranslate.app/PlugIns/LLMTranslateShareExt.appex/), поэтому
        # тот же относительный путь до Frameworks хост-приложения подходит.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    postbuildScripts:
      # См. комментарий у одноимённого шага в таргете LLMTranslate — тот же
      # баг xcodegen (.strings не группируется как localized resource).
      - name: "Скопировать Localizable.strings (xcodegen не группирует .strings как localized resource)"
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$DEST"
          cp "$SRCROOT/LLMTranslateShareExt/Resources/en.lproj/Localizable.strings" "$DEST/"
    dependencies:
      - target: LLMTranslateKit
        embed: false
        link: true

  LLMTranslateControl:
    type: app-extension
    platform: iOS
    sources:
      - path: LLMTranslateControl/Sources
      # Раздел 10.9 ТЗ: intent-файлы в двух таргетах сразу (Target Membership
      # на приложение и на этот таргет) — без этого ControlWidgetButton не
      # может сослаться на TranslateLatestScreenshotIntent, объявленный в
      # LLMTranslate. Сам интент по-прежнему выполняется в процессе
      # приложения (openAppWhenRun), не здесь — этому таргету он нужен только
      # для компиляции ссылки.
      - path: LLMTranslate/Sources/Intents
    resources:
      - path: LLMTranslateControl/Resources/en.lproj/Localizable.strings
    info:
      path: LLMTranslateControl/Info.plist
      properties:
        CFBundleDisplayName: BYO Translate Control
        # Проверено вживую на установке в симулятор: installd отказывается
        # ставить бандл, если для com.apple.widgetkit-extension задан
        # NSExtensionPrincipalClass — этот extension point находит @main-тип
        # сам, в отличие от «классических» расширений (Share/Translation).
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.control
        PRODUCT_NAME: LLMTranslateControl
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: false
        # Тот же фикс, что и у остальных расширений — см. комментарий у
        # LLMTranslateTextExt.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    postbuildScripts:
      # См. комментарий у одноимённого шага в таргете LLMTranslate — тот же
      # баг xcodegen (.strings не группируется как localized resource).
      - name: "Скопировать Localizable.strings (xcodegen не группирует .strings как localized resource)"
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$DEST"
          cp "$SRCROOT/LLMTranslateControl/Resources/en.lproj/Localizable.strings" "$DEST/"
    dependencies:
      - target: LLMTranslateKit
        embed: false
        link: true

  LLMTranslateKit:
    type: framework
    platform: iOS
    sources:
      - path: LLMTranslateKit/Sources
    resources:
      - path: LLMTranslateKit/Resources/en.lproj/Localizable.strings
    info:
      path: LLMTranslateKit/Info.plist
      properties:
        CFBundleDisplayName: BYO Translate Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.kit
        PRODUCT_NAME: LLMTranslateKit
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        DEFINES_MODULE: true
        SKIP_INSTALL: false
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        SUPPORTS_MACCATALYST: false
    postbuildScripts:
      # См. комментарий у одноимённого шага в таргете LLMTranslate — тот же
      # баг xcodegen (.strings не группируется как localized resource).
      - name: "Скопировать Localizable.strings (xcodegen не группирует .strings как localized resource)"
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$DEST"
          cp "$SRCROOT/LLMTranslateKit/Resources/en.lproj/Localizable.strings" "$DEST/"

  LLMTranslateKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LLMTranslateKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.kit.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SUPPORTS_MACCATALYST: false
    dependencies:
      - target: LLMTranslateKit
        embed: true
    scheme:
      testTargets:
        - LLMTranslateKitTests
      test:
        config: Debug
