name: LLMTranslate
options:
  bundleIdPrefix: com.tyrex.llmtranslate
  deploymentTarget:
    iOS: "18.4"
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LLMTranslate:
    type: application
    platform: iOS
    sources:
      - path: LLMTranslate/Sources
    resources:
      - path: LLMTranslate/Resources/Assets.xcassets
    entitlements:
      path: LLMTranslate/Resources/LLMTranslate.entitlements
      properties:
        com.apple.developer.translation-app: true
        com.apple.security.application-groups:
          - group.com.tyrex.llmtranslate
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyrex.llmtranslate.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate
        PRODUCT_NAME: LLMTranslate
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: LLMTranslate
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: LLMTranslateTextExt
        embed: true
      - target: LLMTranslateShareExt
        embed: true
      - target: LLMTranslateKit
        embed: true
    postbuildScripts:
      # `INFOPLIST_KEY_com.apple.developer.translation-ui-provider.network-access`
      # не подхватывается генератором Info.plist (точки в имени ключа — не
      # обычный Apple-подкейс вроде UILaunchScreen_Generation), поэтому ключ
      # раздела 4.2 ТЗ добавляется постобработкой уже сгенерированного файла.
      - name: "Добавить translation-ui-provider.network-access в Info.plist"
        script: |
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.translation-ui-provider.network-access" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.translation-ui-provider.network-access bool true" "$PLIST"
    scheme: {}

  LLMTranslateTextExt:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: LLMTranslateTextExt/Sources
    info:
      path: LLMTranslateTextExt/Info.plist
      properties:
        CFBundleDisplayName: LLMTranslate Text
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.public.translation-ui-provider
    entitlements:
      path: LLMTranslateTextExt/LLMTranslateTextExt.entitlements
      properties:
        com.apple.developer.translation-app: true
        com.apple.security.application-groups:
          - group.com.tyrex.llmtranslate
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyrex.llmtranslate.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.textext
        PRODUCT_NAME: LLMTranslateTextExt
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: false
        # LLMTranslateKit не embed-ится в само расширение (embed: false
        # ниже) — единственная копия лежит в LLMTranslate.app/Frameworks,
        # embed-нутая хост-приложением. Без явного добавления
        # @executable_path/../../Frameworks сюда расширение падает при
        # запуске: "Library not loaded: @rpath/LLMTranslateKit.framework" —
        # дефолтный LD_RUNPATH_SEARCH_PATHS для extensionkit-extension
        # содержит только @executable_path/Frameworks (свою же, пустую,
        # папку), путь до Frameworks хост-приложения в шаблоне Xcode
        # добавляется отдельной строкой (см. LD_RUNPATH_SEARCH_PATHS в
        # "iOS ExtensionKit Extension Base.xctemplate"), но xcodegen не
        # применяет этот темплейт-дефолт сам по себе.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - target: LLMTranslateKit
        embed: false
        link: true

  LLMTranslateShareExt:
    type: app-extension
    platform: iOS
    sources:
      - path: LLMTranslateShareExt/Sources
    info:
      path: LLMTranslateShareExt/Info.plist
      properties:
        CFBundleDisplayName: LLMTranslate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Раздел 10.3 ТЗ: только изображения, максимум одно за раз;
            # текст сюда не принимаем — для текста работает F1
            # (TranslationUIProvider).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: LLMTranslateShareExt/LLMTranslateShareExt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tyrex.llmtranslate
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyrex.llmtranslate.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.shareext
        PRODUCT_NAME: LLMTranslateShareExt
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: false
        # Тот же фикс, что и у LLMTranslateTextExt — см. комментарий там.
        # Классическое app-extension тоже embed-ится на два уровня вложенности
        # (LLMTranslate.app/PlugIns/LLMTranslateShareExt.appex/), поэтому
        # тот же относительный путь до Frameworks хост-приложения подходит.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - target: LLMTranslateKit
        embed: false
        link: true

  LLMTranslateKit:
    type: framework
    platform: iOS
    sources:
      - path: LLMTranslateKit/Sources
    info:
      path: LLMTranslateKit/Info.plist
      properties:
        CFBundleDisplayName: LLMTranslateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.kit
        PRODUCT_NAME: LLMTranslateKit
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        DEFINES_MODULE: true
        SKIP_INSTALL: false
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        SUPPORTS_MACCATALYST: false

  LLMTranslateKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LLMTranslateKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrex.llmtranslate.kit.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SUPPORTS_MACCATALYST: false
    dependencies:
      - target: LLMTranslateKit
        embed: true
    scheme:
      testTargets:
        - LLMTranslateKitTests
      test:
        config: Debug
